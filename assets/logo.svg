<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-label="Empty Room Logo">
  <defs>
    <!-- Ambient dark depth -->
    <radialGradient id="circleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14171c" />
      <stop offset="85%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#030406" />
    </radialGradient>
    
    <!-- Ethereal portal glow -->
    <filter id="doorGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle inner rim for security motif -->
    <linearGradient id="ringStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b4252" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1f232a" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Outer Black Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#circleGrad)" stroke="url(#ringStroke)" stroke-width="3" />

  <!-- Subtle Precision Grid Crosshairs -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#2e3440" stroke-width="1" stroke-dasharray="2 6" opacity="0.4" />

  <!-- Doorway Glow Backdrop -->
  <rect x="62" y="62" width="76" height="76" rx="4" fill="#ffffff" opacity="0.12" filter="url(#doorGlow)" />

  <!-- Center White Doorway (Solid White Square Frame representing doorway) -->
  <rect x="64" y="64" width="72" height="72" rx="3" fill="#ffffff" filter="url(#doorGlow)" />
  <!-- Inner negative space doorway threshold -->
  <rect x="74" y="74" width="52" height="52" rx="2" fill="#0c0e12" />
  
  <!-- Subtle doorway light beam onto floor -->
  <polygon points="76,124 124,124 136,156 64,156" fill="#ffffff" opacity="0.08" />
  
  <!-- Door Threshold line -->
  <line x1="72" y1="126" x2="128" y2="126" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />
</svg>
