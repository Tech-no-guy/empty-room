<!DOCTYPE html>
<html>
<head>
    <title>Presence Locker Settings</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; background: #e9ecef; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .row { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        button { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin-top: 0;">System Settings</h2>
        <form action="/update" method="POST">
            <div class="row">
                <label>Enable Auto-Lock:</label>
                <input type="checkbox" name="enabled" {% if config.enabled %}checked{% endif %}>
            </div>
            <div class="row">
                <label>Strict Match (Your Face Only):</label>
                <input type="checkbox" name="strict_match" {% if config.strict_match %}checked{% endif %}>
            </div>
            <div class="row">
                <label>Lock Delay (seconds):</label>
                <input type="number" name="timeout" value="{{ config.timeout }}" min="3" max="300" style="width: 70px; padding: 4px;">
            </div>
            <button type="submit">Save Configuration</button>
        </form>
    </div>
</body>
</html>
