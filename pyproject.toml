[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "empty-room"
version = "1.0.0"
description = "Smart screen lock that automatically secures your computer when you walk away."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Empty Room Contributors" }]
requires-python = ">=3.8"
keywords = ["security", "presence-detection", "auto-lock", "computer-vision", "smart-screen-lock"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "opencv-contrib-python>=4.8.0",
    "numpy>=1.24.0",
    "Flask>=3.0.0",
    "Werkzeug>=3.0.0",
]

[project.scripts]
empty-room = "core.cli:main"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.setuptools.package-data]
core = [
    "server/templates/*.html",
    "server/static/**/*",
    "data/*.xml"
]
